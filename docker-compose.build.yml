# Build override — use with the main compose file to build the image from this
# checkout instead of pulling the published one:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# The image builds the frontend itself, so only Docker is required.
services:
  comphost:
    build:
      context: .
      dockerfile: docker/comphost.Dockerfile
    image: "${COMPHOST_IMAGE:-comphost:latest}"
