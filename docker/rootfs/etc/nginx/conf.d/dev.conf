server {
	listen 81 default;
	listen [::]:81 default;

	server_name nginxproxymanager-dev;
	root /app/frontend/dist;
	access_log /dev/null;

	# Same headers as production, except the CSP: the Vite dev server injects
	# inline scripts for HMR and needs eval. Dev is not a security boundary; the
	# policy that actually ships is conf.d/include/admin-security.conf.template.
	add_header X-Content-Type-Options   "nosniff"                          always;
	add_header X-Frame-Options          "DENY"                             always;
	add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
	add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://www.gravatar.com; connect-src 'self' ws: wss:; worker-src 'self' blob:" always;

	location /api {
		return 302 /api/;
	}

	# Credential submission is rate limited (see limit_req_zone in nginx.conf).
	location = /api/tokens {
		limit_req zone=comphost_login burst=5 nodelay;
		proxy_http_version    1.1;
		proxy_set_header Host $host;
		proxy_set_header      X-Forwarded-Scheme $scheme;
		proxy_set_header      X-Forwarded-Proto  $scheme;
		proxy_set_header      X-Forwarded-For    $remote_addr;
		proxy_pass            http://127.0.0.1:3000/tokens;
	}

	location /api/ {
		proxy_http_version    1.1;
		proxy_set_header Host $host;
		proxy_set_header      X-Forwarded-Scheme $scheme;
		proxy_set_header      X-Forwarded-Proto  $scheme;
		proxy_set_header      X-Forwarded-For    $remote_addr;
		# CompHost: WebSocket upgrade (stack terminals) + unbuffered SSE (stack logs)
		proxy_set_header      Upgrade $http_upgrade;
		proxy_set_header      Connection $http_connection;
		proxy_buffering       off;
		proxy_cache           off;
		proxy_pass            http://127.0.0.1:3000/;

		proxy_read_timeout 15m;
		proxy_send_timeout 15m;
	}

	location / {
		proxy_http_version    1.1;
		proxy_set_header Host $host;
		proxy_set_header      Upgrade $http_upgrade;
		proxy_set_header      Connection "Upgrade";
		proxy_set_header      X-Forwarded-Scheme $scheme;
		proxy_set_header      X-Forwarded-Proto  $scheme;
		proxy_set_header      X-Forwarded-For    $remote_addr;
		proxy_pass            http://127.0.0.1:5173;
	}
}
